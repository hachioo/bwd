<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VoltCore – Shop</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  /* ── Shop page layout ── */
  .shop-hero {
    padding: 110px 5% 50px;
    position: relative;
    z-index: 1;
    border-bottom: 1px solid var(--border);
  }
  .shop-hero h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(2rem, 5vw, 3.4rem);
    font-weight: 800;
    line-height: 1.1;
    margin-bottom: 10px;
  }
  .shop-hero h1 span { color: var(--accent); }
  .shop-hero p { color: var(--text-muted); font-size: 0.95rem; }

  .shop-body {
    padding: 40px 5% 80px;
    position: relative;
    z-index: 1;
  }

  /* toolbar */
  .shop-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }
  .shop-search {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 18px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    width: 280px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .shop-search:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(0,229,255,0.08);
  }
  .shop-search::placeholder { color: var(--text-muted); }

  .sort-select {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.82rem;
    outline: none;
    cursor: pointer;
  }
  .sort-select option { background: var(--surface2); }

  .shop-count {
    font-size: 0.82rem;
    color: var(--text-muted);
    white-space: nowrap;
  }
  .shop-count span { color: var(--accent); font-weight: 700; }

  /* ── Cart drawer ── */
  .cart-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
    z-index: 900;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  .cart-overlay.open { opacity: 1; pointer-events: all; }

  .cart-drawer {
    position: fixed;
    top: 0;
    right: 0;
    width: 420px;
    max-width: 100vw;
    height: 100vh;
    background: var(--surface);
    border-left: 1px solid var(--border);
    z-index: 950;
    display: flex;
    flex-direction: column;
    transform: translateX(100%);
    transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
  }
  .cart-drawer.open { transform: translateX(0); }

  .cart-header {
    padding: 24px 24px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .cart-header h2 {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 1.25rem;
  }
  .cart-close {
    width: 36px; height: 36px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    cursor: pointer;
    font-size: 1.1rem;
    display: flex; align-items: center; justify-content: center;
    transition: border-color 0.2s;
  }
  .cart-close:hover { border-color: var(--accent); color: var(--accent); }

  .cart-items {
    flex: 1;
    overflow-y: auto;
    padding: 16px 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .cart-empty {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--text-muted);
    font-size: 0.9rem;
    padding: 60px 0;
  }
  .cart-empty-icon { font-size: 3rem; }

  .cart-item {
    display: grid;
    grid-template-columns: 64px 1fr auto;
    gap: 14px;
    align-items: center;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
  }
  .cart-item-img {
    width: 64px; height: 64px;
    border-radius: 8px;
    background: var(--surface3);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .cart-item-img img { width: 100%; height: 100%; object-fit: contain; padding: 6px; }
  .cart-item-name { font-weight: 700; font-size: 0.82rem; margin-bottom: 4px; line-height: 1.3; }
  .cart-item-price { color: var(--accent); font-size: 0.85rem; font-weight: 700; }
  .cart-item-controls {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .qty-btn {
    width: 28px; height: 28px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface3);
    color: var(--text);
    cursor: pointer;
    font-size: 1rem;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .qty-btn:hover { border-color: var(--accent); color: var(--accent); }
  .qty-val { font-size: 0.88rem; font-weight: 700; color: var(--accent); min-width: 20px; text-align: center; }
  .remove-btn {
    background: none;
    border: none;
    color: #ef4444;
    cursor: pointer;
    font-size: 0.7rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-top: 2px;
    transition: opacity 0.2s;
  }
  .remove-btn:hover { opacity: 0.7; }

  .cart-footer {
    padding: 20px 24px 28px;
    border-top: 1px solid var(--border);
  }
  .cart-subtotal {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
  }
  .cart-subtotal span:first-child { color: var(--text-muted); font-size: 0.88rem; }
  .cart-subtotal span:last-child { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.3rem; color: var(--accent); }
  .checkout-btn {
    width: 100%;
    padding: 14px;
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 12px;
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.02em;
  }
  .checkout-btn:hover { box-shadow: 0 8px 32px rgba(0,229,255,0.35); transform: translateY(-1px); }
  .clear-btn {
    width: 100%;
    margin-top: 10px;
    padding: 10px;
    background: none;
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  .clear-btn:hover { border-color: #ef4444; color: #ef4444; }

  /* nav cart badge */
  .cart-badge {
    background: var(--accent);
    color: #000;
    border-radius: 50%;
    width: 18px; height: 18px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    font-weight: 700;
  }

  /* product grid on shop page uses full width, 4 col */
  .shop-products-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 20px;
    margin-top: 10px;
  }

  /* add-to-cart animation pulse */
  @keyframes addPulse {
    0% { transform: scale(1); }
    40% { transform: scale(1.25); }
    100% { transform: scale(1); }
  }
  .add-btn.pulse { animation: addPulse 0.3s ease; }
</style>
</head>
<body>

<!-- NAV -->
<nav>
  <div class="logo" style="cursor:pointer" onclick="location.href='main.html'">
    <div class="logo-icon">⚡</div> Volt<span>Core</span>
  </div>
  <ul class="nav-links">
    <li><a href="main.html">Home</a></li>
    <li><a href="shop.html" style="color:var(--accent)">Shop</a></li>
    <li><a href="project.html">Projects</a></li>
    <li><a href="blog.html">Blog</a></li>
  </ul>
  <div class="nav-right">
    <button class="cart-btn" id="cart-open-btn" onclick="openCart()">
      🛒 Cart <span class="cart-badge" id="cart-count">0</span>
    </button>
  </div>
</nav>

<!-- SHOP HERO -->
<div class="shop-hero">
  <span class="section-label">VoltCore Store</span>
  <h1>All <span>Products</span></h1>
  <p>Browse our full catalogue of electronic components, modules, and tools.</p>
</div>

<!-- MAIN SHOP BODY -->
<div class="shop-body">

  <!-- TABS -->
  <div class="tabs" style="margin-bottom:28px">
    <button class="tab active" onclick="setTab(this,'all')">All</button>
    <button class="tab" onclick="setTab(this,'iot')">IoT & Wireless</button>
    <button class="tab" onclick="setTab(this,'robotics')">Robotics</button>
    <button class="tab" onclick="setTab(this,'displays')">Displays</button>
    <button class="tab" onclick="setTab(this,'tools')">Tools</button>
  </div>

  <!-- TOOLBAR -->
  <div class="shop-toolbar">
    <input class="shop-search" id="shop-search" type="text" placeholder="🔍 Search products..." oninput="applyFilters()">
    <div style="display:flex;align-items:center;gap:14px">
      <select class="sort-select" id="sort-select" onchange="applyFilters()">
        <option value="default">Sort: Featured</option>
        <option value="price-asc">Price: Low → High</option>
        <option value="price-desc">Price: High → Low</option>
        <option value="name">Name A–Z</option>
      </select>
      <div class="shop-count">Showing <span id="shown-count">0</span> products</div>
    </div>
  </div>

  <!-- GRID -->
  <div class="shop-products-grid" id="shop-grid"></div>
</div>

<!-- CART OVERLAY -->
<div class="cart-overlay" id="cart-overlay" onclick="closeCart()"></div>

<!-- CART DRAWER -->
<div class="cart-drawer" id="cart-drawer">
  <div class="cart-header">
    <h2>🛒 Your Cart</h2>
    <button class="cart-close" onclick="closeCart()">✕</button>
  </div>
  <div class="cart-items" id="cart-items-list"></div>
  <div class="cart-footer" id="cart-footer" style="display:none">
    <div class="cart-subtotal">
      <span>Subtotal</span>
      <span id="cart-total">0₫</span>
    </div>
    <button class="checkout-btn" onclick="showToast('🎉 Checkout coming soon!')">Proceed to Checkout</button>
    <button class="clear-btn" onclick="clearCart()">Remove all items</button>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast">
  <span>✅</span>
  <span id="toast-msg">Added to cart!</span>
</div>

<script>
// ─────────────────────────────────────────────
// PRODUCT DATA
// ─────────────────────────────────────────────
const PRODUCTS = [
  { id:'esp32s3', category:'iot', brand:'Espressif', name:'ESP32-S3-DevKitC-1',
    specs:'Dual-core Wi-Fi + BT 5.0, 8MB PSRAM, USB-C',
    img:'img/ESP32-S3-DevKitC-1.png', priceRaw:185000, priceNew:'185.000₫', priceOld:'210.000₫', badge:'hot' },
  { id:'ov7670', category:'iot', brand:'Omnivision', name:'Camera OV7670 Module',
    specs:'640×480 resolution, I2C interface',
    img:'img/Camera OV7670 Module.png', priceRaw:65000, priceNew:'65.000₫', priceOld:'85.000₫', badge:'sale' },
  { id:'esp8266', category:'iot', brand:'Espressif', name:'ESP8266 NodeMCU v3',
    specs:'Wi-Fi 802.11 b/g/n, 80MHz, 4MB Flash',
    img:'img/ESP8266 NodeMCU v3.jpg', priceRaw:55000, priceNew:'55.000₫', priceOld:'70.000₫', badge:'sale' },
  { id:'lora32', category:'iot', brand:'TTGO', name:'LoRa32 SX1276 Module',
    specs:'868/915 MHz LoRa, OLED 0.96", ESP32',
    img:'img/LoRa32 SX1276 Module.png', priceRaw:210000, priceNew:'210.000₫', badge:'hot' },
  { id:'bms3s', category:'robotics', brand:'Generic', name:'BMS 3S 40A Module',
    specs:'Lithium battery protection with balance',
    img:'img/BMS 3S 40A Module.png', priceRaw:42000, priceNew:'42.000₫' },
  { id:'nano', category:'robotics', brand:'Arduino', name:'Arduino Nano Every',
    specs:'ATMega4809, 20MHz, 48KB Flash',
    img:'img/Arduino Nano Every.png', priceRaw:245000, priceNew:'245.000₫' },
  { id:'servo', category:'robotics', brand:'Tower Pro', name:'MG996R Servo Motor',
    specs:'11 kg/cm torque, 360° rotation, metal gear',
    img:'img/MG996R Servo Motor.png', priceRaw:75000, priceNew:'75.000₫', priceOld:'95.000₫', badge:'sale' },
  { id:'stepper', category:'robotics', brand:'Generic', name:'NEMA 17 Stepper Motor',
    specs:'1.8° step angle, 2A, 59 N·cm holding torque',
    img:'img/NEMA 17 Stepper Motor.png', priceRaw:145000, priceNew:'145.000₫' },
  { id:'oled128', category:'displays', brand:'Waveshare', name:'OLED 1.3" SH1106',
    specs:'128×64 px, I2C/SPI, 3.3–5V',
    img:'img/OLED 1.3 SH1106.png', priceRaw:38000, priceNew:'38.000₫', priceOld:'50.000₫', badge:'sale' },
  { id:'tft24', category:'displays', brand:'Ilitek', name:'TFT 2.4" ILI9341',
    specs:'240×320 px, SPI, touch screen, SD slot',
    img:'img/TFT 2.4 ILI9341.png', priceRaw:89000, priceNew:'89.000₫', badge:'hot' },
  { id:'epaper', category:'displays', brand:'Good Display', name:'E-Paper 2.9" HAT',
    specs:'296×128 px, ultra-low power, SPI',
    img:'img/E-Paper 2.9 HAT.png', priceRaw:185000, priceNew:'185.000₫' },
  { id:'lcd16', category:'displays', brand:'HD44780', name:'LCD 16×2 with I2C',
    specs:'16 columns × 2 rows, backlight, I2C backpack',
    img:'img/LCD 16x2 with I2C.png', priceRaw:28000, priceNew:'28.000₫', priceOld:'35.000₫', badge:'sale' },
  { id:'logic8', category:'tools', brand:'Saleae', name:'Logic Analyzer 8CH',
    specs:'24MHz sampling, USB, compatible with Logic 2',
    img:'img/Logic Analyzer 8CH.png', priceRaw:320000, priceNew:'320.000₫', priceOld:'390.000₫', badge:'sale' },
  { id:'multimeter', category:'tools', brand:'UNI-T', name:'UT61E Digital Multimeter',
    specs:'True RMS, 22000 counts, auto range',
    img:'img/UT61E Digital Multimeter.png', priceRaw:580000, priceNew:'580.000₫', badge:'hot' },
  { id:'psu', category:'tools', brand:'RIDEN', name:'RD6006 Power Supply Module',
    specs:'60V 6A, constant voltage/current, LCD',
    img:'img/RD6006 Power Supply Module.png', priceRaw:750000, priceNew:'750.000₫' },
  { id:'heatgun', category:'tools', brand:'Quick', name:'858D Hot Air Rework',
    specs:'200–480°C, digital display, adjustable airflow',
    img:'img/858D Hot Air Rework.png', priceRaw:490000, priceNew:'490.000₫', priceOld:'550.000₫', badge:'sale' },
];

// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
let currentFilter = 'all';
let cart = JSON.parse(localStorage.getItem('vc_cart') || '[]');

function saveCart() { localStorage.setItem('vc_cart', JSON.stringify(cart)); }

// ─────────────────────────────────────────────
// RENDER GRID
// ─────────────────────────────────────────────
function applyFilters() {
  const q = document.getElementById('shop-search').value.toLowerCase();
  const sort = document.getElementById('sort-select').value;

  let list = currentFilter === 'all' ? [...PRODUCTS] : PRODUCTS.filter(p => p.category === currentFilter);
  if (q) list = list.filter(p => p.name.toLowerCase().includes(q) || p.brand.toLowerCase().includes(q) || p.specs.toLowerCase().includes(q));

  if (sort === 'price-asc') list.sort((a,b) => a.priceRaw - b.priceRaw);
  else if (sort === 'price-desc') list.sort((a,b) => b.priceRaw - a.priceRaw);
  else if (sort === 'name') list.sort((a,b) => a.name.localeCompare(b.name));

  document.getElementById('shown-count').textContent = list.length;

  document.getElementById('shop-grid').innerHTML = list.length ? list.map(p => `
    <div class="product-card">
      <div class="product-img">
        <img src="${p.img}" alt="${p.name}" class="main-img">
        ${p.badge ? `<span class="product-badge ${p.badge}">${p.badge.toUpperCase()}</span>` : ''}
        <div class="wishlist-btn" onclick="toggleWish(this)">🤍</div>
      </div>
      <div class="product-info">
        <span class="product-brand">${p.brand}</span>
        <h3 class="product-name">${p.name}</h3>
        <p class="product-specs">${p.specs}</p>
        <div class="product-bottom">
          <div class="product-price">
            <span class="price-new">${p.priceNew}</span>
            ${p.priceOld ? `<span class="price-old">${p.priceOld}</span>` : ''}
          </div>
          <button class="add-btn" onclick="addToCart('${p.id}', this)">+</button>
        </div>
      </div>
    </div>
  `).join('') : `<div style="grid-column:1/-1;text-align:center;color:var(--text-muted);padding:60px 0;font-size:0.95rem">No products found for "<strong>${q}</strong>"</div>`;
}

function setTab(el, filter) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  currentFilter = filter;
  applyFilters();
}

// ─────────────────────────────────────────────
// CART LOGIC
// ─────────────────────────────────────────────
function addToCart(id, btn) {
  const product = PRODUCTS.find(p => p.id === id);
  if (!product) return;

  const existing = cart.find(i => i.id === id);
  if (existing) existing.qty++;
  else cart.push({ id, name: product.name, img: product.img, priceRaw: product.priceRaw, priceNew: product.priceNew, qty: 1 });

  saveCart();
  updateCartCount();
  renderCartDrawer();

  // Pulse animation
  btn.classList.remove('pulse');
  void btn.offsetWidth;
  btn.classList.add('pulse');

  showToast(`Added: ${product.name}`);
}

function changeQty(id, delta) {
  const item = cart.find(i => i.id === id);
  if (!item) return;
  item.qty += delta;
  if (item.qty <= 0) cart = cart.filter(i => i.id !== id);
  saveCart();
  updateCartCount();
  renderCartDrawer();
}

function removeItem(id) {
  cart = cart.filter(i => i.id !== id);
  saveCart();
  updateCartCount();
  renderCartDrawer();
}

function clearCart() {
  cart = [];
  saveCart();
  updateCartCount();
  renderCartDrawer();
}

function updateCartCount() {
  const total = cart.reduce((s, i) => s + i.qty, 0);
  document.getElementById('cart-count').textContent = total;
}

function renderCartDrawer() {
  const list = document.getElementById('cart-items-list');
  const footer = document.getElementById('cart-footer');

  if (!cart.length) {
    list.innerHTML = `<div class="cart-empty"><div class="cart-empty-icon">🛒</div><div>Your cart is empty</div><div style="font-size:0.8rem;color:var(--text-muted)">Add some products to get started</div></div>`;
    footer.style.display = 'none';
    return;
  }

  list.innerHTML = cart.map(item => `
    <div class="cart-item">
      <div class="cart-item-img"><img src="${item.img}" alt="${item.name}"></div>
      <div>
        <div class="cart-item-name">${item.name}</div>
        <div class="cart-item-price">${item.priceNew}</div>
      </div>
      <div class="cart-item-controls">
        <button class="qty-btn" onclick="changeQty('${item.id}', 1)">+</button>
        <span class="qty-val">${item.qty}</span>
        <button class="qty-btn" onclick="changeQty('${item.id}', -1)">−</button>
        <button class="remove-btn" onclick="removeItem('${item.id}')">✕ remove</button>
      </div>
    </div>
  `).join('');

  const subtotal = cart.reduce((s, i) => s + i.priceRaw * i.qty, 0);
  document.getElementById('cart-total').textContent = subtotal.toLocaleString('vi-VN') + '₫';
  footer.style.display = 'block';
}

function openCart() {
  document.getElementById('cart-drawer').classList.add('open');
  document.getElementById('cart-overlay').classList.add('open');
}
function closeCart() {
  document.getElementById('cart-drawer').classList.remove('open');
  document.getElementById('cart-overlay').classList.remove('open');
}

// ─────────────────────────────────────────────
// MISC
// ─────────────────────────────────────────────
function toggleWish(el) {
  el.textContent = el.textContent === '🤍' ? '❤️' : '🤍';
  if (el.textContent === '❤️') showToast('Added to wishlist!');
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
applyFilters();
updateCartCount();
renderCartDrawer();
</script>
</body>
</html>
